<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="ext-version" content="1.7.1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smooth Trend</title>
  <link rel="stylesheet" href="./smooth-trend.css?v=1.7.1" />
  <!-- Vendored libraries (no CDN, so it also works on locked-down Tableau Server networks) -->
  <script src="../../shared/lib/d3.v7.min.js?v=1.7.1"></script>
  <script src="../../shared/lib/tableau.extensions.1.latest.min.js?v=1.7.1"></script>
  <script src="../../shared/context-menu.js?v=1.7.1"></script>
  <script src="./smooth-trend.js?v=1.7.1" defer></script>
</head>
<body>
  <div id="app" class="st-root">
    <header id="header" class="st-header" hidden>
      <div class="st-head-left">
        <div id="icon" class="st-icon" aria-hidden="true"></div>
        <div class="st-titles">
          <div id="title" class="st-title"></div>
          <div id="subtitle" class="st-subtitle"></div>
        </div>
      </div>
      <div class="st-kpi">
        <div id="kpiLabel" class="st-kpi-label"></div>
        <div id="kpiValue" class="st-kpi-value"></div>
        <div class="st-kpi-delta">
          <span id="deltaPill" class="st-pill"></span>
          <span id="deltaCaption" class="st-pill-caption"></span>
        </div>
      </div>
    </header>
    <div id="legend" class="st-legend" hidden></div>
    <div id="chart" class="st-chart"></div>
    <div id="empty" class="st-empty" hidden></div>
    <div id="tooltip" class="st-tooltip" role="tooltip" hidden></div>
  </div>
</body>
</html>
